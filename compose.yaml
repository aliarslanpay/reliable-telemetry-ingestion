name: reliable-telemetry
services:
  broker:
    image: eclipse-mosquitto:2.0.22
    ports: ["127.0.0.1:18883:1883"]
    volumes:
      - ./local/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./local/acl:/mosquitto/config/acl:ro
      - ./.runtime/passwords:/mosquitto/config/passwords:ro
  postgres:
    image: postgres:16.15-bookworm
    environment:
      POSTGRES_USER: telemetry
      POSTGRES_DB: telemetry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/local_setup.py first}
    ports: ["127.0.0.1:15432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ingestion/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry"]
      interval: 2s
      timeout: 2s
      retries: 15
  worker-1:
    build: {context: ., dockerfile: local/Dockerfile}
    environment:
      MQTT_HOST: broker
      MQTT_USERNAME: worker-1
      MQTT_PASSWORD: ${WORKER1_PASSWORD:?Run scripts/local_setup.py first}
      DATABASE_URL: postgresql://telemetry:${POSTGRES_PASSWORD}@postgres/telemetry
    depends_on:
      postgres: {condition: service_healthy}
      broker: {condition: service_started}
volumes:
  pgdata:
